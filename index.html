<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dado Virtual</title>


    <style>

        /* ================================================= */
        /* CONFIGURACIÓN GENERAL                             */
        /* ================================================= */

        :root {


            /* ================================================= */
            /* TAMAÑO DEL DADO                                  */
            /* ================================================= */

            --dado-tamano: 210px;

            --punto-tamano: 40px;


            /* ================================================= */
            /* COLORES DEL DADO                                  */
            /* ================================================= */

            --dado-color: #ffffff;

            --dado-color-presionado: #ffd92f;

            --punto-color: #007bff;

            --dado-radio: 22px;



            /* ================================================= */
            /* BOTÓN "CÓMO JUGAR"                                */
            /* ================================================= */

            /* ANCHO */

            --boton-ancho: 220px;


            /* ALTO */

            --boton-alto: 45px;


            /* TAMAÑO DEL TEXTO */

            --boton-texto: 20px;


            /* COLOR DEL BOTÓN */

            --boton-color: #007bff;


            /* COLOR DEL TEXTO */

            --boton-texto-color: #ffffff;


            /* COLOR AL PRESIONAR */

            --boton-color-presionado: #007bff;


            /* REDONDEO */

            --boton-radio: 14px;



            /* ================================================= */
            /* BARRA DE PROGRESO                                 */
            /* ================================================= */

            /* ANCHO DE LA BARRA */

            --barra-ancho: 280px;


            /* GROSOR DE LA BARRA */

            --barra-alto: 6px;


            /* COLOR DEL FONDO */

            --barra-fondo: #dddddd;


            /* COLOR DEL PROGRESO */

            --barra-color: #007bff;


            /* COLOR DEL PUNTO DESLIZABLE */

            --barra-punto-color: #007bff;


            /* TAMAÑO DEL PUNTO */

            --barra-punto-tamano: 14px;


            /* REDONDEO */

            --barra-radio: 10px;



            /* ================================================= */
            /* POSICIÓN DE LA BARRA Y LOS TIEMPOS                 */
            /* ================================================= */

            /*
               ESTE VALOR MUEVE TODO EL BLOQUE
               HACIA ARRIBA O HACIA ABAJO.

               EJEMPLOS:

               0px   = posición normal
              -20px  = 20px hacia arriba
               30px  = 30px hacia abajo
            */

            --posicion-barra: 6px;



            /* ================================================= */
            /* COLOR DE LOS NÚMEROS DE TIEMPO                     */
            /* ================================================= */

            --color-tiempo: 

666666;


            /* TAMAÑO DE LOS NÚMEROS */

            --tamano-tiempo: 13px;

        }



        /* ================================================= */
        /* PÁGINA                                             */
        /* ================================================= */

        body {

            margin: 0;

            background: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }



        /* ================================================= */
        /* TARJETA                                            */
        /* ================================================= */

        .card {

            position: relative;

            width:
                calc(100% - 32px);

            max-width: 420px;

            margin:
                20px auto;

            border-radius: 20px;

            overflow: visible;

        }



        /* ================================================= */
        /* PORTADA                                            */
        /* ================================================= */

        .cover {

            display: block;

            width: 100%;

            border-radius: 20px;

            transition:
                opacity .20s ease;

        }



        /* ================================================= */
        /* BOTÓN CÓMO JUGAR                                   */
        /* ================================================= */

        .contenedor-tutorial {

             width: auto;

            text-align: center;

            margin-top: 0px;

            margin-bottom: 10px;

        }



        .boton-tutorial {

            width:
                var(--boton-ancho);

            height:
                var(--boton-alto);

            background:
                var(--boton-color);

            color:
                var(--boton-texto-color);

            font-size:
                var(--boton-texto);

            font-weight: bold;

            border: none;

            border-radius:
                var(--boton-radio);

            cursor: pointer;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            box-sizing: border-box;

            transition:

                background-color .15s ease,

                transform .15s ease;

        }



        .boton-tutorial:hover {

            transform:
                scale(1.04);

        }



        .boton-tutorial:active {

            background:
                var(--boton-color-presionado);

            transform:
                scale(.96);

        }



        /* ================================================= */
        /* BOTONES DE IMAGEN LATERALES                         */
        /* ================================================= */

        .contenedor-botones-tutorial {

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-top: 0px;

            margin-bottom: 10px;

        }

        .boton-imagen-lateral {

            border: none;

            background: transparent;

            padding: 0;

            margin: 0;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            flex: 0 0 auto;

        }

        .imagen-boton-lateral {

            width: 50px;

            height: 45px;

            object-fit: contain;

            display: block;

            transition: transform .15s ease;

        }

        .boton-imagen-lateral:hover .imagen-boton-lateral {

            transform: scale(1.20);

        }

        .boton-imagen-lateral:active .imagen-boton-lateral {

            transform: scale(1);

        }

        /* ================================================= */
        /* VENTANA DE IMAGEN AGRANDADA                        */
        /* ================================================= */

        .visor-imagen {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background: rgba(0,0,0,.75);

            align-items: center;

            justify-content: center;

            padding: 20px;

            box-sizing: border-box;

            cursor: pointer;

        }

        .visor-imagen img {

            max-width: 95%;

            max-height: 90%;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 10px;

            cursor: default;

        }

        .cerrar-visor {

            position: absolute;

            top: 15px;

            right: 20px;

            color: #ffffff;

            font-size: 38px;

            font-weight: bold;

            line-height: 1;

            cursor: pointer;

            user-select: none;

        }



        /* ================================================= */
        /* CONTENEDOR DE LA BARRA                              */
        /* ================================================= */

        .contenedor-progreso {

            width: 100%;

            text-align: center;

            margin-top: 10px;

            margin-bottom: 5px;

            transform:
                translateY(var(--posicion-barra));

        }



        /* ================================================= */
        /* BARRA DESLIZABLE                                   */
        /* ================================================= */

        .barra-progreso {

            position: relative;

            width:
                var(--barra-ancho);

            height:
                var(--barra-alto);

            background:
                var(--barra-fondo);

            border-radius:
                var(--barra-radio);

            display: inline-block;

            cursor: pointer;

            touch-action: none;

        }



        /* ================================================= */
        /* PARTE AVANZADA                                     */
        /* ================================================= */

        .progreso {

            position: absolute;

            left: 0;

            top: 0;

            width: 0%;

            height: 100%;

            background:
                var(--barra-color);

            border-radius:
                var(--barra-radio);

            pointer-events: none;

        }



        /* ================================================= */
        /* PUNTO DESLIZABLE                                   */
        /* ================================================= */

        .punto-progreso {

            position: absolute;

            top: 50%;

            left: 0%;

            width:
                var(--barra-punto-tamano);

            height:
                var(--barra-punto-tamano);

            background:
                var(--barra-punto-color);

            border-radius: 50%;

            transform:
                translate(-50%, -50%);

            cursor: grab;

            box-shadow:
                0 2px 5px rgba(0,0,0,.25);

            transition:
                transform .1s ease;

        }



        .punto-progreso:hover {

            transform:
                translate(-50%, -50%)
                scale(1.15);

        }



        .punto-progreso:active {

            cursor: grabbing;

            transform:
                translate(-50%, -50%)
                scale(1.2);

        }



        /* ================================================= */
        /* TIEMPO DEL AUDIO                                   */
        /* ================================================= */

        .tiempo-tutorial {

            text-align: center;

            font-size:
                var(--tamano-tiempo);

            color:
                var(--color-tiempo);

            margin-top: 8px;

            margin-bottom: 5px;

            transform:
                translateY(var(--posicion-barra));

        }



        /* ================================================= */
        /* DADO                                              */
        /* ================================================= */

        .dado {

            transform: translateY(-5px);

            position: relative;

            margin:
                50px auto 0 auto;

            width:
                var(--dado-tamano);

            height:
                var(--dado-tamano);

            background:
                var(--dado-color);

            border-radius:
                var(--dado-radio);

            z-index: 10;

            cursor: pointer;       

            display: grid;

            grid-template-columns:
                1fr 1fr 1fr;

            grid-template-rows:
                1fr 1fr 1fr;

            padding: 18px;

            box-sizing: border-box;

            box-shadow:

                0 10px 18px
                rgba(0,0,0,.28),

                0 3px 5px
                rgba(0,0,0,.15),

                inset 0 -5px 0
                rgba(0,0,0,.08);

            transition:

                background-color .15s ease,

                box-shadow .15s ease;

           

        }



        /* ================================================= */
        /* DADO PRESIONADO                                    */
        /* ================================================= */

        .dado.presionado {

            background:
                var(--dado-color-presionado);

            box-shadow:

                0 10px 18px
                rgba(0,0,0,.30),

                0 4px 7px
                rgba(0,0,0,.18),

                inset 0 -5px 0
                rgba(0,0,0,.08);

        }



        /* ================================================= */
        /* EFECTO AL PRESIONAR                                */
        /* ================================================= */

        .dado:active {

            transform:
                scale(.94);

            box-shadow:

                0 5px 10px
                rgba(0,0,0,.25),

                inset 0 -3px 0
                rgba(0,0,0,.08);

        }



        /* ================================================= */
        /* PUNTOS DEL DADO                                    */
        /* ================================================= */

        .punto {

            width:
                var(--punto-tamano);

            height:
                var(--punto-tamano);

            background:
                var(--punto-color);

            border-radius: 50%;

            align-self: center;

            justify-self: center;

        }



        /* ================================================= */
        /* POSICIONES                                         */
        /* ================================================= */

        .p1 {

            grid-column: 1;

            grid-row: 1;

        }


        .p2 {

            grid-column: 2;

            grid-row: 1;

        }


        .p3 {

            grid-column: 3;

            grid-row: 1;

        }


        .p4 {

            grid-column: 1;

            grid-row: 2;

        }


        .p5 {

            grid-column: 2;

            grid-row: 2;

        }


        .p6 {

            grid-column: 3;

            grid-row: 2;

        }


        .p7 {

            grid-column: 1;

            grid-row: 3;

        }


        .p8 {

            grid-column: 2;

            grid-row: 3;

        }


        .p9 {

            grid-column: 3;

            grid-row: 3;

        }



        /* ================================================= */
        /* ANIMACIÓN DEL DADO                                 */
        /* ================================================= */

        .tirando {

            animation:
                tirarDado .45s ease;

        }



        @keyframes tirarDado {

            0% {

                transform:
                    rotate(0deg)
                    scale(1);

                box-shadow:

                    0 10px 18px
                    rgba(0,0,0,.28),

                    0 3px 5px
                    rgba(0,0,0,.15),

                    inset 0 -5px 0
                    rgba(0,0,0,.08);

            }


            30% {

                transform:
                    rotate(15deg)
                    scale(1.08);

                box-shadow:

                    0 16px 25px
                    rgba(0,0,0,.30),

                    0 5px 8px
                    rgba(0,0,0,.18),

                    inset 0 -5px 0
                    rgba(0,0,0,.08);

            }


            60% {

                transform:
                    rotate(-15deg)
                    scale(1.08);

                box-shadow:

                    0 16px 25px
                    rgba(0,0,0,.30),

                    0 5px 8px
                    rgba(0,0,0,.18),

                    inset 0 -5px 0
                    rgba(0,0,0,.08);

            }


            100% {

                transform:
                    rotate(0deg)
                    scale(1);

                box-shadow:

                    0 10px 18px
                    rgba(0,0,0,.28),

                    0 3px 5px
                    rgba(0,0,0,.15),

                    inset 0 -5px 0
                    rgba(0,0,0,.08);

            }

        }



        /* ================================================= */
        /* BOTÓN SITIO WEB                                    */
        /* ================================================= */

        .contenedor-enlace-web {

            text-align: center;

            margin-top: 50px;

            margin-bottom: 20px;

            width: 100%;

        }



        .enlace-imagen {

            display: inline-block;

            text-decoration: none;

        }



        .imagen-boton {

            max-width: 260px;

            width: 100%;

            height: auto;

            display: block;

            margin: 0 auto;

            transition:
                transform .2s ease;

        }



        .imagen-boton:hover {

            transform:
                scale(1.05);

            cursor: pointer;

        }

    

        /* ================================================= */
        /* BOTONES DE PREGUNTAS                               */
        /* ================================================= */

      .contenedor-preguntas {

            /* MISMO ANCHO MÁXIMO QUE LA PORTADA */
            width: calc(90% - 50px);
            max-width: 420px;

            margin: 50px auto 0 auto;

            display: grid;

            /* 4 BOTONES POR FILA */
            grid-template-columns: repeat(5, 1fr);

            gap: 10px;
        }

        .boton-pregunta {

            width: 100%;

            padding: 10px 8px;

            border: none;

            border-radius: 12px;

            background: #007bff;

            color: white;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13);

            transition: 0.2s;

        }

        .boton-pregunta.activo {

            background: #ff8c1a !important;

            color: white;

            transform: scale(1.03);

        }


        .boton-pregunta:hover {

            transform: scale(1.04);

        }

        .boton-pregunta:active {

            transform: scale(0.97);
            background: #ff8c1a

        }

    </style>

</head>



<body>


    <!-- ================================================= -->
    <!-- TARJETA                                           -->
    <!-- ================================================= -->

    <div class="card">


        <!-- ================================================= -->
        <!-- PORTADA                                            -->
        <!-- ================================================= -->

        <img
            id="portada"
            class="cover"
            src="portada.png"
            alt="Portada"
        >



        <!-- ================================================= -->
        <!-- BOTÓN CÓMO JUGAR                                   -->
        <!-- ================================================= -->

        <div class="contenedor-botones-tutorial">

            <!-- BOTÓN IZQUIERDO: ABRE UNA IMAGEN AGRANDADA -->
            <button
                class="boton-imagen-lateral"
                onclick="abrirImagenGrande()"
                aria-label="Ver imagen"
            >
                <img
                    class="imagen-boton-lateral"
                    src="boton-ojo.png"
                    alt="Ver imagen"
                >
            </button>

            <!-- BOTÓN ORIGINAL: CÓMO JUGAR -->
            <div class="contenedor-tutorial">

                <button
                    id="botonTutorial"
                    class="boton-tutorial"
                    onclick="controlarTutorial()"
                >
                    HOW TO PLAY?
                </button>

            </div>

            <!-- BOTÓN DERECHO: DESCARGA EL PDF -->
            <button
                class="boton-imagen-lateral"
                onclick="descargarPDF()"
                aria-label="Descargar PDF"
            >
                <img
                    class="imagen-boton-lateral"
                    src="boton-flecha.png"
                    alt="Descargar PDF"
                >
            </button>

        </div>



        <!-- ================================================= -->
        <!-- BARRA DE PROGRESO                                  -->
        <!--                                                     -->
        <!-- SIEMPRE VISIBLE                                    -->
        <!-- ================================================= -->

        <div
            class="contenedor-progreso"
            id="contenedorProgreso"
        >

            <div
                class="barra-progreso"
                id="barraProgreso"
            >

                <!-- PARTE AVANZADA -->

                <div
                    class="progreso"
                    id="progreso"
                ></div>


                <!-- PUNTO DESLIZABLE -->

                <div
                    class="punto-progreso"
                    id="puntoProgreso"
                ></div>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- TIEMPO                                             -->
        <!-- ================================================= -->

        <div
            id="tiempoTutorial"
            class="tiempo-tutorial"
        >
            0:00 / 0:00
        </div>



        <!-- ================================================= -->
        <!-- DADO                                               -->
        <!-- ================================================= -->

        <div
            id="dado"
            class="dado"
            onclick="tirarDado()"
        >

            <div
                id="p1"
                class="punto p1"
            ></div>

            <div
                id="p2"
                class="punto p2"
            ></div>

            <div
                id="p3"
                class="punto p3"
            ></div>

            <div
                id="p4"
                class="punto p4"
            ></div>

            <div
                id="p5"
                class="punto p5"
            ></div>

            <div
                id="p6"
                class="punto p6"
            ></div>

            <div
                id="p7"
                class="punto p7"
            ></div>

            <div
                id="p8"
                class="punto p8"
            ></div>

            <div
                id="p9"
                class="punto p9"
            ></div>

        </div>


    </div>



    <!-- ================================================= -->
    <!-- 30 BOTONES DE PREGUNTAS                            -->
    <!-- ================================================= -->

    <div
        id="botonesPreguntas"
        class="contenedor-preguntas"
    ></div>



    <!-- ================================================= -->
    <!-- BOTÓN SITIO WEB                                    -->
    <!-- ================================================= -->

    <div class="contenedor-enlace-web">

        <a
            href="https://readmindbk.github.io/WEB/"
            class="enlace-imagen"
            target="_blank"
        >

            <img
                class="imagen-boton"
                src="web.png"
                alt="Sitio Web"
            >

        </a>

    </div>



    <!-- ================================================= -->
    <!-- VISOR DE IMAGEN AGRANDADA                           -->
    <!-- ================================================= -->

    <div
        id="visorImagen"
        class="visor-imagen"
        onclick="cerrarImagenGrande(event)"
    >

        <span
            class="cerrar-visor"
            onclick="cerrarImagenGrande(event)"
        >
            &times;
        </span>

        <img
            id="imagenGrande"
            src="imagen-grande.jpg"
            alt="Imagen ampliada"
        >

    </div>



    <!-- ================================================= -->
    <!-- JAVASCRIPT                                         -->
    <!-- ================================================= -->

    <script>


        /* ================================================= */
        /* BOTÓN IZQUIERDO: IMAGEN AGRANDADA                  */
        /* ================================================= */

        function abrirImagenGrande() {

            document.getElementById("visorImagen").style.display =
                "flex";

        }


        function cerrarImagenGrande(event) {

            if (
                event.target.id === "visorImagen" ||
                event.target.classList.contains("cerrar-visor")
            ) {

                document.getElementById("visorImagen").style.display =
                    "none";

            }

        }


        /* ================================================= */
        /* BOTÓN DERECHO: DESCARGAR PDF                       */
        /* ================================================= */

function descargarPDF() {

    window.open("instructivo.pdf", "_blank");

}



        /* ================================================= */
        /* SONIDO DEL DADO                                    */
        /* ================================================= */

        const sonidoDado =
            new Audio("dado.mp3");



        /* ================================================= */
        /* AUDIO DEL TUTORIAL                                 */
        /* ================================================= */

        const audioTutorial =
            new Audio("tutorial.mp3");



        /* ================================================= */
        /* AUDIO DE PREGUNTAS                                 */
        /* ================================================= */

        const audioPreguntas =
            new Audio("preguntas.mp3");

        audioPreguntas.preload = "auto";


        /* ================================================= */
        /* TIEMPOS DE LAS 30 PREGUNTAS                        */
        /*                                                     */
        /* t = segundo exacto donde empieza cada pregunta.   */
        /* La pregunta termina automáticamente cuando llega  */
        /* al t de la siguiente.                              */
        /* ================================================= */

        const preguntas = [

            { t: 0,  n: "1" },
            { t: 3,  n: "2" },
            { t: 6.5,  n: "3" },
            { t: 9.5,  n: "4" },
            { t: 12,  n: "5" },
            { t: 14.5,  n: "6" },
            { t: 17.5, n: "7" },
            { t: 21.5, n: "8" },
            { t: 24, n: "9" },
            { t: 26.5, n: "10" },
            { t: 29.5, n: "11" },
            { t: 33, n: "12" },
            { t: 36, n: "13" },
            { t: 38.5, n: "14" },
            { t: 41, n: "15" },
            { t: 43, n: "16" },
            { t: 46.5, n: "17" },
            { t: 49.5, n: "18" },
            { t: 52.5, n: "19" },
            { t: 55.5, n: "20" },
            { t: 59, n: "21" },
            { t: 62, n: "22" },
            { t: 65, n: "23" },
            { t: 68.5, n: "24" },
            { t: 71.5, n: "25" },
            { t: 75.5, n: "26" },
            { t: 79, n: "27" },
            { t: 82.8, n: "28" },
            { t: 86.5, n: "29" },
            { t: 90, n: "30" }

        ];


        const botonesPreguntas =
            document.getElementById("botonesPreguntas");

        let preguntaActiva = -1;


        /* ================================================= */
        /* CREAR LOS 30 BOTONES                                */
        /* ================================================= */

        preguntas.forEach(function(pregunta, indice) {

            const boton =
                document.createElement("button");

            boton.className =
                "boton-pregunta";

            boton.textContent =
                pregunta.n;

            boton.type = "button";

            boton.addEventListener(
                "click",
                function() {

                    reproducirPregunta(indice);

                }
            );

            botonesPreguntas.appendChild(boton);

        });



        /* ================================================= */
        /* REPRODUCIR UNA PREGUNTA                            */
        /* ================================================= */

        function reproducirPregunta(indice) {

            const pregunta =
                preguntas[indice];


            /* Si el tutorial está sonando, se pausa. */

            if (
                !audioTutorial.paused &&
                !audioTutorial.ended
            ) {

                audioTutorial.pause();

                botonTutorial.textContent =
                    "PAUSE";

            }


            /* Detener cualquier pregunta anterior. */

            audioPreguntas.pause();


            /*
               Primero guardamos la nueva pregunta como activa.
               Esto hace que el botón quede naranja inmediatamente.
            */

            preguntaActiva = indice;

            actualizarBotonesPreguntas();


            /*
               Ahora posicionamos el audio en el inicio
               exacto de esta pregunta.
            */

            audioPreguntas.currentTime =
                pregunta.t;


            audioPreguntas.play().catch(function(error) {

                console.error(
                    "No se pudo reproducir preguntas.mp3:",
                    error
                );

            });

        }



        /* ================================================= */
        /* MARCAR EL BOTÓN ACTIVO                             */
        /* ================================================= */

        function actualizarBotonesPreguntas() {

            const botones =
                botonesPreguntas.querySelectorAll(".boton-pregunta");

            botones.forEach(function(boton) {

                boton.classList.remove("activo");

            });

            if (preguntaActiva >= 0) {

                botones[preguntaActiva].classList.add("activo");

            }

        }



        /* ================================================= */
        /* DETENER AL LLEGAR AL FINAL DE LA PREGUNTA          */
        /* ================================================= */

        audioPreguntas.addEventListener(
            "timeupdate",
            function() {

                if (preguntaActiva < 0) {
                    return;
                }


                const siguiente =
                    preguntas[preguntaActiva + 1];


                /*
                   La pregunta termina exactamente cuando
                   comienza la siguiente.
                */

                if (
                    siguiente &&
                    audioPreguntas.currentTime >= siguiente.t
                ) {

                    audioPreguntas.pause();


                    /*
                       Recién ahora quitamos el estado naranja.
                    */

                    preguntaActiva = -1;

                    actualizarBotonesPreguntas();

                }

            }
        );


        /* ================================================= */
        /* CUANDO TERMINA LA ÚLTIMA PREGUNTA                   */
        /* ================================================= */

        audioPreguntas.addEventListener(
            "ended",
            function() {

                preguntaActiva = -1;

                actualizarBotonesPreguntas();

            }
        );


        /* ================================================= */
        /* CONFIGURACIÓN DE LAS IMÁGENES                       */
        /* ================================================= */

        /*
           ACÁ DEFINÍS EN QUÉ SEGUNDO CAMBIA CADA IMAGEN.

           PODÉS USAR DECIMALES.

           EJEMPLO:

           8.5 = 8 segundos y medio
        */


        const pasosTutorial = [

            {
                segundo: 13,
                imagen: "tuto1.png"
            },
            {
                segundo: 23,
                imagen: "tuto2.png"
            },
            {
                segundo: 27,
                imagen: "tuto3.png"
            },

            {
                segundo: 33,
                imagen: "tuto4.png"
            },

            {
                segundo: 45,
                imagen: "tuto5.png"
            },
            {
                segundo: 51,
                imagen: "portada.png"
            }
        ];



        /* ================================================= */
        /* ELEMENTOS HTML                                     */
        /* ================================================= */

        const portada =
            document.getElementById("portada");


        const botonTutorial =
            document.getElementById("botonTutorial");


        const progreso =
            document.getElementById("progreso");


        const puntoProgreso =
            document.getElementById("puntoProgreso");


        const barraProgreso =
            document.getElementById("barraProgreso");


        const tiempoTutorial =
            document.getElementById("tiempoTutorial");



        /* ================================================= */
        /* CONTROLAR TUTORIAL                                  */
        /* ================================================= */

        function controlarTutorial() {


            /* Si hay una pregunta reproduciéndose, se detiene. */

            if (
                !audioPreguntas.paused &&
                !audioPreguntas.ended
            ) {

                audioPreguntas.pause();

                preguntaActiva = -1;

                actualizarBotonesPreguntas();

            }


            /* ================================================= */
            /* SI ESTÁ REPRODUCIENDO → PAUSAR                     */
            /* ================================================= */

            if (
                !audioTutorial.paused &&
                !audioTutorial.ended
            ) {

                audioTutorial.pause();

                botonTutorial.textContent =
                    "PAUSE";

                return;

            }



            /* ================================================= */
            /* SI TERMINÓ → VOLVER AL PRINCIPIO                  */
            /* ================================================= */

            if (
                audioTutorial.ended
            ) {

                audioTutorial.currentTime =
                    100;

            }



            /* ================================================= */
            /* REPRODUCIR                                         */
            /* ================================================= */

            audioTutorial.play();

            botonTutorial.textContent =
                "PLAYING";

        }



        /* ================================================= */
        /* ACTUALIZAR BARRA AUTOMÁTICAMENTE                     */
        /* ================================================= */

        audioTutorial.addEventListener(
            "timeupdate",
            function() {


                actualizarBarra();


                cambiarImagenSegunTiempo();

            }
        );



        /* ================================================= */
        /* ACTUALIZAR BARRA                                    */
        /* ================================================= */

        function actualizarBarra() {


            if (
                !isFinite(audioTutorial.duration) ||
                audioTutorial.duration <= 0
            ) {

                return;

            }



            const porcentaje =

                (
                    audioTutorial.currentTime /
                    audioTutorial.duration
                ) * 100;



            /* ================================================= */
            /* BARRA                                                */
            /* ================================================= */

            progreso.style.width =
                porcentaje + "%";



            /* ================================================= */
            /* PUNTO                                                */
            /* ================================================= */

            puntoProgreso.style.left =
                porcentaje + "%";



            /* ================================================= */
            /* TIEMPO                                               */
            /* ================================================= */

            tiempoTutorial.textContent =

                formatearTiempo(
                    audioTutorial.currentTime
                )
                +
                " / "
                +
                formatearTiempo(
                    audioTutorial.duration
                );

        }



        /* ================================================= */
        /* MOVER AUDIO CON EL MOUSE O DEDO                     */
        /* ================================================= */

        let arrastrando =
            false;



        /* ================================================= */
        /* INICIAR ARRASTRE                                    */
        /* ================================================= */

        puntoProgreso.addEventListener(
            "pointerdown",
            function(event) {

                arrastrando =
                    true;

                puntoProgreso.setPointerCapture(
                    event.pointerId
                );

                moverAudioDesdePunto(
                    event
                );

            }
        );



        /* ================================================= */
        /* ARRASTRAR                                           */
        /* ================================================= */

        puntoProgreso.addEventListener(
            "pointermove",
            function(event) {

                if (
                    !arrastrando
                ) {

                    return;

                }


                moverAudioDesdePunto(
                    event
                );

            }
        );



        /* ================================================= */
        /* TERMINAR ARRASTRE                                   */
        /* ================================================= */

        puntoProgreso.addEventListener(
            "pointerup",
            function(event) {

                arrastrando =
                    false;

            }
        );



        puntoProgreso.addEventListener(
            "pointercancel",
            function() {

                arrastrando =
                    false;

            }
        );



        /* ================================================= */
        /* TAMBIÉN SE PUEDE TOCAR LA BARRA                     */
        /* ================================================= */

        barraProgreso.addEventListener(
            "pointerdown",
            function(event) {


                if (
                    event.target ===
                    puntoProgreso
                ) {

                    return;

                }


                moverAudioDesdeBarra(
                    event
                );

            }
        );



        /* ================================================= */
        /* MOVER AUDIO DESDE EL PUNTO                           */
        /* ================================================= */

        function moverAudioDesdePunto(
            event
        ) {

            const rect =
                barraProgreso.getBoundingClientRect();


            let posicion =
                event.clientX -
                rect.left;


            posicion =
                Math.max(
                    0,
                    Math.min(
                        posicion,
                        rect.width
                    )
                );


            cambiarTiempoDesdePosicion(
                posicion,
                rect.width
            );

        }



        /* ================================================= */
        /* MOVER AUDIO DESDE LA BARRA                          */
        /* ================================================= */

        function moverAudioDesdeBarra(
            event
        ) {

            const rect =
                barraProgreso.getBoundingClientRect();


            let posicion =
                event.clientX -
                rect.left;


            posicion =
                Math.max(
                    0,
                    Math.min(
                        posicion,
                        rect.width
                    )
                );


            cambiarTiempoDesdePosicion(
                posicion,
                rect.width
            );

        }



        /* ================================================= */
        /* CAMBIAR EL TIEMPO DEL AUDIO                          */
        /* ================================================= */

        function cambiarTiempoDesdePosicion(
            posicion,
            ancho
        ) {


            if (
                !isFinite(
                    audioTutorial.duration
                )
            ) {

                return;

            }



            const porcentaje =
                posicion / ancho;



            audioTutorial.currentTime =

                porcentaje *
                audioTutorial.duration;



            actualizarBarra();

            cambiarImagenSegunTiempo();

        }



        /* ================================================= */
        /* CAMBIAR IMAGEN SEGÚN SEGUNDO                         */
        /* ================================================= */

        function cambiarImagenSegunTiempo() {


            let imagenActual =
                "portada.png";



            for (
                let i = 0;
                i < pasosTutorial.length;
                i++
            ) {


                if (
                    audioTutorial.currentTime >=
                    pasosTutorial[i].segundo
                ) {

                    imagenActual =
                        pasosTutorial[i].imagen;

                }

            }



            /* ================================================= */
            /* CAMBIAR SOLAMENTE SI ES NECESARIO                   */
            /* ================================================= */

            if (
                portada.getAttribute("src") !==
                imagenActual
            ) {

            /* se puede impletentar un pestaneo por cada pase de imagen colocando 0  */
                portada.style.opacity =
                    "100";


                setTimeout(
                    function() {

                        portada.src =
                            imagenActual;

                        portada.style.opacity =
                            "1";

                    },
                    100
                );

            }

        }



        /* ================================================= */
        /* CUANDO TERMINA EL AUDIO                             */
        /* ================================================= */

        audioTutorial.addEventListener(
            "ended",
            function() {


                botonTutorial.textContent =
                    "HOW TO PLAY?";


                actualizarBarra();



                /*
                   NO OCULTAMOS LA BARRA.

                   QUEDA VISIBLE EN 100%.
                */



                setTimeout(
                    function() {

                        portada.style.opacity =
                            "0";


                        setTimeout(
                            function() {

                                portada.src =
                                    "portada.png";

                                portada.style.opacity =
                                    "1";

                            },
                            100
                        );

                    },
                    500
                );

            }
        );



        /* ================================================= */
        /* CUANDO SE CARGA EL AUDIO                            */
        /* ================================================= */

        audioTutorial.addEventListener(
            "loadedmetadata",
            function() {


                tiempoTutorial.textContent =

                    "0:00 / " +

                    formatearTiempo(
                        audioTutorial.duration
                    );


                actualizarBarra();

            }
        );



        /* ================================================= */
        /* FORMATEAR TIEMPO                                    */
        /* ================================================= */

        function formatearTiempo(
            segundos
        ) {


            if (
                !isFinite(segundos)
            ) {

                return "0:00";

            }


            segundos =
                Math.floor(segundos);


            const minutos =
                Math.floor(
                    segundos / 60
                );


            const segundosRestantes =
                segundos % 60;


            return (

                minutos
                +
                ":"
                +
                segundosRestantes
                    .toString()
                    .padStart(
                        2,
                        "0"
                    )

            );

        }



        /* ================================================= */
        /* FUNCIÓN TIRAR DADO                                  */
        /* ================================================= */

        function tirarDado() {


            const dado =
                document.getElementById("dado");



            /* ================================================= */
            /* SONIDO                                              */
            /* ================================================= */

            sonidoDado.currentTime =
                0;

            sonidoDado.play();



            /* ================================================= */
            /* EFECTO AMARILLO                                    */
            /* ================================================= */

            dado.classList.add(
                "presionado"
            );


            setTimeout(
                function() {

                    dado.classList.remove(
                        "presionado"
                    );

                },
                50
            );



            /* ================================================= */
            /* NÚMERO ALEATORIO                                    */
            /* ================================================= */

            const numero =

                Math.floor(
                    Math.random() * 6
                ) + 1;



            /* ================================================= */
            /* ANIMACIÓN                                           */
            /* ================================================= */

            dado.classList.remove(
                "tirando"
            );


            void dado.offsetWidth;


            dado.classList.add(
                "tirando"
            );



            /* ================================================= */
            /* OCULTAR PUNTOS                                      */
            /* ================================================= */

            document
                .querySelectorAll(".punto")
                .forEach(
                    punto => {

                        punto.style.display =
                            "none";

                    }
                );



            /* ================================================= */
            /* CARAS                                                */
            /* ================================================= */

            const caras = {


                1: [
                    "p5"
                ],


                2: [
                    "p1",
                    "p9"
                ],


                3: [
                    "p1",
                    "p5",
                    "p9"
                ],


                4: [
                    "p1",
                    "p3",
                    "p7",
                    "p9"
                ],


                5: [
                    "p1",
                    "p3",
                    "p5",
                    "p7",
                    "p9"
                ],


                6: [
                    "p1",
                    "p3",
                    "p4",
                    "p6",
                    "p7",
                    "p9"
                ]

            };



            /* ================================================= */
            /* MOSTRAR PUNTOS                                      */
            /* ================================================= */

            caras[numero].forEach(
                id => {

                    document
                        .getElementById(id)
                        .style.display =
                        "block";

                }
            );



            console.log(
                "Salió:",
                numero
            );

        }



        /* ================================================= */
        /* CARA INICIAL                                         */
        /* ================================================= */

        document
            .getElementById("p5")
            .style.display =
            "block";


    </script>


</body>

</html>
